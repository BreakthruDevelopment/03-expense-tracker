name: Live smoke test

# Runs scripts/smoke.sh against the deployed app: sign-ups, expenses, a receipt upload to the
# real bucket, extract (live or demo), CSV and cleanup. Two ways to point it at a URL:
#   - Actions tab > Run workflow, and type the base URL; or
#   - push a claude/live-smoke* branch that has the URL in .github/live-smoke-url (one line).
# There is no default URL until the app is deployed (issue 10): the run.app or app3 URL goes there.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test (the app's own public URL, https)
        required: false
        default: ""
  push:
    branches: ["claude/live-smoke*"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Pick the URL to test
        id: url
        env:
          INPUT_URL: ${{ inputs.base_url }}
        run: |
          url="${INPUT_URL:-}"
          if [ -z "$url" ] && [ -f .github/live-smoke-url ]; then
            url="$(grep -v '^[[:space:]]*#' .github/live-smoke-url | head -n1 | tr -d '[:space:]')"
          fi
          if [ -z "$url" ]; then
            echo "::error::No URL. Pass base_url, or put the deployed URL in .github/live-smoke-url."
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *) echo "::error::The live URL must start with https://"; exit 1 ;;
          esac
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "Testing ${url%/}" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the live site
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
          # The live app has a bucket, so the receipt upload must run, not be skipped.
          REQUIRE_RECEIPTS: "1"
        run: bash scripts/smoke.sh
